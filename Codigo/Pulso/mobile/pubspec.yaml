name: pulso
description: App nativo do Pulso — autenticação na mesma API Node da Web (RF-140).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  go_router: ^16.2.1
  provider: ^6.1.5
  google_sign_in: ^6.3.0
  web: ^1.1.1
  app_links: ^6.4.0
  shared_preferences: ^2.5.3
  flutter_svg: ^2.2.1
  google_fonts: ^6.2.1
  file_picker: ^11.0.3
  socket_io_client: ^3.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/LogoMClaro.png
    - assets/brand/LogoMEscuro.png
    - assets/brand/PulsoIcon.png
    - assets/brand/google_g.svg
