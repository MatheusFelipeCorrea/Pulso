# yaml-language-server: $schema=./project.schema.json
# Prefer: run the `project-startup` skill ("Faça o start-up deste repositório")
# so `project-discovery` generates this file from evidence. Or copy this
# template to `.github/project.yml` and keep only fields that apply.
# All paths are POSIX-style and relative to repository root.

version: 1
name: Example Project
locale: en
layout: single

apps:
  app:
    root: .
    manifest: package.json
    source_dirs:
      - src
    test_dirs:
      - tests
    # orm:
    #   kind: your-orm
    #   schema: path/to/schema

docs:
  root: docs
  requirements: docs/requirements.md
  diagrams: docs/diagrams
  blueprints: .github/docs

outputs:
  audits: .github/audits/results
  cards: .github/plans/cards
  implementations: .github/plans/implementations

# Hints accelerate discovery; they are never treated as proof.
stack_hints: []

conventions:
  requirement_prefixes:
    - REQ
  finding_prefixes:
    product-owner: PO
    application-security: SEC
    devops: OPS
    code-review: DEV
    ux-design: UX
    architecture: ARCH

# Optional product/domain context. Remove this section if no overlay is needed.
# audits:
#   overlay: .github/audits/overlays/project.md
