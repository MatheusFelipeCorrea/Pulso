# yaml-language-server: $schema=../Hyperion/.github/project.schema.json
# Contrato do produto Pulso — kit Hyperion em pasta aninhada.

version: 1

kit:
  root: Hyperion

name: Pulso
locale: pt-BR

layout: monorepo

apps:
  api:
    root: Codigo/Pulso/api
    manifest: Codigo/Pulso/api/package.json
    source_dirs:
      - Codigo/Pulso/api/src
  web:
    root: Codigo/Pulso/web
    manifest: Codigo/Pulso/web/package.json
    source_dirs:
      - Codigo/Pulso/web/src

docs:
  requirements: Documentacao/01-Produto
  blueprints: Documentacao/02-Engenharia
  diagrams: Documentacao/04-Diagramas
  historical_audits: Documentacao/03-Auditorias

outputs:
  audits: Hyperion/.github/audits/results
  cards: Hyperion/.github/plans/cards
  implementations: Hyperion/.github/plans/implementations
  diagrams: Hyperion/.github/diagrams

stack_hints:
  - Node.js
  - Express
  - Prisma
  - PostgreSQL
  - React
  - Vite

conventions:
  requirement_prefixes:
    - RF
    - RN
    - RNF
    - PULSO
  finding_prefixes:
    product-owner: PO
    application-security: SEC
    devops: OPS
    code-review: DEV
    ux-design: UX
    architecture: ARCH

management:
  backend: github

audits:
  overlay: null

ci:
  provider: github-actions
  policy: detect
  stack: node-npm
  existing:
    - .github/workflows/ci.yml
    - .github/workflows/security.yml
    - .github/workflows/labeler.yml
  hyperion:
    # Sync cards: workflow adaptado (kit nested). Security/validate do kit: off —
    # Pulso já tem security.yml e o validate do kit assume layout na raiz.
    cards_sync: true
    kit_validation: false
    security_scan: false
    product_ci: false

commands:
  test: npm test --prefix Codigo/Pulso/api
  lint: npm run lint --prefix Codigo/Pulso/api
  build: npm run build
  audit: npm audit --prefix Codigo/Pulso/api --audit-level=moderate

memory:
  auto_capture: true
  decisions_file: Hyperion/.github/memory/DECISIONS.md

uncertainties:
  - Templates hyperion-* padrão assumem kit na raiz; sync-cards foi adaptado para kit.root=Hyperion
  - Project number do GitHub Projects ainda não configurado (autoCreate no sync)
  - Lint do web tem débito pré-existente (continue-on-error no CI)
