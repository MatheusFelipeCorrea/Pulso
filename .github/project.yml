# yaml-language-server: $schema=../Hyperion/.github/project.schema.json
# Contract of the PULSO product. Kit lives under Hyperion/.
# After scaffolding React / Node / Flutter, refresh with /discover.

version: 1

kit:
  root: Hyperion

name: Pulso
locale: pt-BR

layout: monorepo

apps:
  api:
    root: Codigo/Pulso/api
    source_dirs:
      - Codigo/Pulso/api
  web:
    root: Codigo/Pulso/web
    source_dirs:
      - Codigo/Pulso/web
  mobile:
    root: Codigo/Pulso/mobile
    source_dirs:
      - Codigo/Pulso/mobile

docs:
  root: docs
  requirements: docs/3.requisitos.md
  api_readme: Codigo/Pulso/api/README.md
  web_readme: Codigo/Pulso/web/README.md
  mobile_readme: Codigo/Pulso/mobile/README.md
  blueprints: docs
  diagrams: docs/imagens

outputs:
  audits: Hyperion/.github/audits/results
  cards: Hyperion/.github/plans/cards
  implementations: Hyperion/.github/plans/implementations
  diagrams: Hyperion/.github/diagrams

stack_hints:
  - React
  - Node.js
  - Flutter

conventions:
  requirement_prefixes:
    - RF
    - RNF
    - REQ
    - BIZ
  finding_prefixes:
    product-owner: PO
    application-security: SEC
    devops: OPS
    code-review: DEV
    ux-design: UX
    architecture: ARCH

management:
  backend: github
  owner: ICEI-PUC-Minas-PMGES-TI
  repo: pmg-es-2026-2-ti5-6904100-pulso

audits:
  overlay: null

ci:
  provider: github-actions
  policy: detect
  stack: node-npm
  hyperion:
    cards_sync: true
    kit_validation: false
    security_scan: true
    product_ci: auto

commands:
  test: null
  lint: null
  build: null
  audit: null

memory:
  auto_capture: true
  decisions_file: Hyperion/.github/memory/DECISIONS.md
  project_file: Hyperion/.github/memory/PROJECT.md

uncertainties:
  - Demo hospedada: web https://pulso-psi-five.vercel.app (Vercel) + API https://pulso-api-aldu.onrender.com (Render) + Neon; ver docs/hospedagem-demo.md.
  - Vercel Hobby pode exigir mirror pessoal (MatheusFelipeCorrea/Pulso) em vez do repo da org.
  - IPA iOS unsigned (Sideloadly/AltStore); APK Android via /downloads/ na landing.
