name: CI

# Roda em qualquer push (inclusive branches de sprint) e em qualquer PR —
# antes só disparava em push para main/master/Dividas, então as sprints
# atuais nunca tinham feedback de CI fora de um PR.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-api:
    name: Lint · API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Codigo/Pulso/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Codigo/Pulso/api/package-lock.json
      - run: npm ci
      - run: npm run lint

  lint-web:
    name: Lint · Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Codigo/Pulso/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Codigo/Pulso/web/package-lock.json
      - run: npm ci
      # Há débito de lint pré-existente no web (React Compiler + regras novas).
      # Não bloqueia o PR ainda — reporta no log até o débito ser resolvido.
      - run: npm run lint
        continue-on-error: true

  test-api:
    name: Test · API (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Codigo/Pulso/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Codigo/Pulso/api/package-lock.json
      - run: npm ci
      - run: npm run test:coverage

  test-web:
    name: Test · Web (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Codigo/Pulso/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Codigo/Pulso/web/package-lock.json
      - run: npm ci
      - run: npm run test:coverage

  build-web:
    name: Build · Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Codigo/Pulso/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Codigo/Pulso/web/package-lock.json
      - run: npm ci
      - run: npm run build

  prisma-check:
    name: Prisma · schema + migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Codigo/Pulso/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pulso
          POSTGRES_PASSWORD: pulso
          POSTGRES_DB: pulso_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulso"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pulso:pulso@localhost:5432/pulso_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Codigo/Pulso/api/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      # Confere se o histórico de migrations sobe sozinho num banco vazio —
      # é exatamente o que a Vercel/Render precisa fazer em cada deploy.
      # Non-blocking por ora: há drift conhecido numa migration antiga
      # (20260529120000_badge_tags_modo_uso_meta_prioridade) que já falha
      # nesse cenário contra um banco novo — precisa de correção manual
      # antes de tornar este passo obrigatório.
      - run: npx prisma migrate deploy
        continue-on-error: true
