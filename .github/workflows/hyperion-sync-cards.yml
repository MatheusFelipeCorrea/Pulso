name: Hyperion — Sync Cards

# Nested kit: cards and scripts live under Hyperion/.
# Forward sync writes the shared GitHub Project. Only main may do that;
# feature branches must not overwrite the board with stale YAML.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without persisting changes"
        required: false
        default: "false"
      sync_direction:
        description: "Sync direction: forward or reverse"
        required: false
        default: "forward"
  push:
    branches: [main]
    paths:
      - "Hyperion/.github/cards/**/*.md"
      - "Hyperion/.github/cards/config/projects-map.json"
      - "Hyperion/scripts/cards-sync/**"

concurrency:
  group: hyperion-sync-cards-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  repository-projects: write

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Hyperion
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Sync cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROJECT_SYNC_TOKEN: ${{ secrets.PROJECT_SYNC_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CREATE_MISSING_LABELS: "true"
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          SYNC_DIRECTION: ${{ github.event.inputs.sync_direction || 'forward' }}
        run: node scripts/cards-sync/sync.mjs
