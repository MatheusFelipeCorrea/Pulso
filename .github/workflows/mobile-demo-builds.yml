name: Mobile demo builds

on:
  workflow_dispatch:
  push:
    paths:
      - 'Codigo/Pulso/mobile/**'
      - '.github/workflows/mobile-demo-builds.yml'
    branches:
      - deploy-demo-s6
      - main

env:
  API_BASE_URL: https://pulso-api-aldu.onrender.com
  FLUTTER_VERSION: '3.47.2'

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Codigo/Pulso/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build release APK
        run: >
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Stage download artifact
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist-downloads"
          cp build/app/outputs/flutter-apk/app-release.apk \
            "$GITHUB_WORKSPACE/dist-downloads/pulso-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: pulso-android-apk
          path: dist-downloads/pulso-android.apk
          if-no-files-found: error

  ios:
    name: Build iOS IPA (unsigned)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Codigo/Pulso/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: >
          flutter build ios --release --no-codesign
          --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Package IPA
        run: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r pulso-ios.ipa Payload
          mkdir -p "$GITHUB_WORKSPACE/dist-downloads"
          mv pulso-ios.ipa "$GITHUB_WORKSPACE/dist-downloads/pulso-ios.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: pulso-ios-ipa
          path: dist-downloads/pulso-ios.ipa
          if-no-files-found: error
