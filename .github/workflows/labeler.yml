name: Labeler

# Marca o PR com web/api/docs/ci/database de acordo com o que mudou —
# ajuda a triar de longe num monorepo com dois projetos.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
